<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AM Marketing | شريكك الرقمي</title>
  <script>
    // GitHub Pages 404 SPA fallback redirect
    var repoPrefix = '/mostafabodye';
    var path = window.location.pathname;
    if (path.indexOf(repoPrefix) === 0) {
      window.location.replace(repoPrefix + '/#projects');
    } else {
      window.location.replace('/#projects');
    }
  </script>
  <style>
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 480px;
      padding: 35px 25px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 { color: #f59e0b; margin-bottom: 12px; font-size: 26px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b0f19;
      font-weight: 800;
      text-decoration: none;
      border-radius: 12px;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h1>AM Marketing</h1>
    <p>جاري تحويلك فوراً إلى منصة المشاريع والأعمال الرسمية...</p>
    <a href="/mostafabodye/#projects">الذهاب للمعرض الآن</a>
  </div>
</body>
</html>
