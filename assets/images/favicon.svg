<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#080c15" stroke="url(#borderGrad)" stroke-width="6" />
  
  <!-- AM Monogram Calligraphy/Typography -->
  <text x="64" y="80" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="52" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="2">AM</text>
  
  <!-- Decorative Dot -->
  <circle cx="98" cy="40" r="6" fill="#06b6d4" />
</svg>
